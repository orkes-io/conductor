---
apiVersion: v1
kind: Namespace
metadata:
  name: conductor
---
apiVersion: v1
kind: Secret
metadata:
  name: conductor-postgres-secret
  namespace: conductor
type: Opaque
stringData:
  username: conductor
  password: conductor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor-config
  namespace: conductor
data:
  config.properties: |
    conductor.grpc-server.enabled=false
    conductor.db.type=postgres
    spring.datasource.url=jdbc:postgresql://conductor-postgres:5432/conductor
    spring.datasource.username=conductor
    spring.datasource.password=conductor
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=2
    conductor.indexing.enabled=false
    loadSample=true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conductor-postgres
  namespace: conductor
spec:
  serviceName: conductor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: conductor-postgres
  template:
    metadata:
      labels:
        app: conductor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: conductor-postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conductor-postgres-secret
                  key: password
            - name: POSTGRES_DB
              value: conductor
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "conductor"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: conductor-postgres
  namespace: conductor
spec:
  selector:
    app: conductor-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor-server
  namespace: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conductor-server
  template:
    metadata:
      labels:
        app: conductor-server
    spec:
      containers:
        - name: conductor
          image: orkesio/orkes-conductor-community:3.30.0.rc6
          env:
            - name: CONFIG_PROP
              value: config.properties
          ports:
            - name: api
              containerPort: 8080
            - name: ui
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: conductor-config
---
apiVersion: v1
kind: Service
metadata:
  name: conductor-server
  namespace: conductor
spec:
  selector:
    app: conductor-server
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: ui
      port: 5000
      targetPort: 5000
